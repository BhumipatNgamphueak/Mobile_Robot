# SLAM Toolbox Configuration for Part 3
# Tuned to TRUST EKF odometry more and reduce false re-corrections

slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    odom_topic: /odom_republished
    mode: mapping

    # Lifecycle node (sync/async)
    # lifecycle: false

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02  # 50Hz TF publish rate
    map_update_interval: 5.0        # Publish map every 5 seconds
    resolution: 0.05                # 5cm map resolution
    max_laser_range: 12.0           # 12m laser range
    minimum_time_interval: 0.15     # Accept scans at 5Hz rate
    transform_timeout: 1.0          # TF lookup timeout
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # === TRUST ODOMETRY MORE ===
    # EKF already corrects odometry, so SLAM should not over-correct
    use_scan_matching: true
    use_scan_barycenter: true

    # Require MORE movement before attempting scan match correction
    minimum_travel_distance: 0.2    # 20cm - more movement required
    minimum_travel_heading: 0.2     # ~11.5 degrees - more rotation required

    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0

    # Require HIGHER confidence before making corrections
    link_match_minimum_response_fine: 0.35   # Increased from 0.1 - need better match
    link_scan_maximum_distance: 1.0         # Reduced - don't link distant scans

    # Loop closure - DISABLED to prevent sudden jumps
    loop_search_maximum_distance: 3.0
    do_loop_closing: false          # Disabled - EKF handles drift
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # === SMALLER SEARCH SPACE ===
    # Since EKF is good, we don't need large corrections
    correlation_search_space_dimension: 0.3   # Reduced from 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.05  # Reduced

    # Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # === HIGHER PENALTIES ===
    # Penalize large corrections more heavily
    distance_variance_penalty: 1.5   # Increased from 0.5
    angle_variance_penalty: 2.0      # Increased from 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.7    # Increased from 0.5
    use_response_expansion: false    # Disabled - don't expand search
