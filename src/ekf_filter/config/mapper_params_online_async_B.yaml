# SLAM Toolbox Configuration for Part 3
# Full SLAM: scan matching + loop closure using EKF odometry as input

slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    odom_topic: /ekf/odometry
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 3.0
    resolution: 0.05
    max_laser_range: 3.5
    minimum_time_interval: 0.2
    transform_timeout: 1.0
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # Scan matching ON - required for full SLAM
    use_scan_matching: true
    use_scan_barycenter: true

    # Movement thresholds
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2

    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0

    # Only accept very good matches
    link_match_minimum_response_fine: 0.3
    link_scan_maximum_distance: 1.5

    # Loop closure ON
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.4
    loop_match_minimum_response_fine: 0.5

    # ULTRA MINIMAL search space - only ±1.5cm corrections allowed
    correlation_search_space_dimension: 0.03
    correlation_search_space_resolution: 0.003
    correlation_search_space_smear_deviation: 0.003

    # Loop closure search space
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ULTRA EXTREME penalties - SLAM follows EKF almost identically
    distance_variance_penalty: 20.0
    angle_variance_penalty: 40.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.05
    coarse_angle_resolution: 0.005
    minimum_angle_penalty: 0.995
    minimum_distance_penalty: 0.98
    use_response_expansion: false
